schema_version: 1
id: lutheran-elca-elw
label: Lutheran, Evangelical Lutheran Worship
family: Lutheran
denomination: Evangelical Lutheran Church in America
service_book: Evangelical Lutheran Worship
rite: Holy Communion
service_plan: lutheran-holy-communion

# ELW text and music are not redistributed here. A church profile selects
# the service setting and points to text it is licensed to use locally.
# The Lutheran service plan expects local files for gathering, prayers,
# great-thanksgiving, lords-prayer, communion, and sending.
choices:
  service_setting:
    label: Holy Communion setting
    values: [Setting One, Setting Two, Setting Three, Setting Four, custom]
  lords_prayer:
    label: Lord's Prayer
    values: [traditional, contemporary, custom]
  prayers_of_the_people:
    label: Prayers of the People form
    values: [seasonal, local, custom]
  eucharistic_prayer:
    label: Great Thanksgiving
    values: [appointed, local, custom]
licensed_sources:
  required: true
  location_hint: worship/liturgy/
