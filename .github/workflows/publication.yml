name: Public publication checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run synthetic regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare the private runtime for the upgrade rehearsal
        run: |
          python tools/handbuilt_runtime.py setup --format json
          python tools/handbuilt_runtime.py verify --format json
      - name: Rehearse a packaged upgrade with church customizations
        run: python tests/smoke_managed_updates.py
      - name: Run public-tree hygiene check
        env:
          PRIVATE_DENYLIST: ${{ secrets.HANDBUILT_PRIVATE_DENYLIST }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # The private denylist (church names, people, emails, addresses, account IDs and
          # figures from real books) lives only in a repository secret, never in the tree.
          if [ -n "$PRIVATE_DENYLIST" ]; then
            printf '%s\n' "$PRIVATE_DENYLIST" > "$RUNNER_TEMP/private-denylist.txt"
            export HANDBUILT_PRIVATE_DENYLIST="$RUNNER_TEMP/private-denylist.txt"
          elif [ "$FROM_FORK" != "true" ]; then
            echo "::error::The HANDBUILT_PRIVATE_DENYLIST repository secret is not set, so this run cannot check for private church data."
            exit 1
          fi
          # Pull request titles, descriptions and commit messages are public too.
          text_args=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request.txt"
            git log --format=%B "$PR_BASE_SHA..$PR_HEAD_SHA" > "$RUNNER_TEMP/commit-messages.txt"
            text_args="--text $RUNNER_TEMP/pull-request.txt --text $RUNNER_TEMP/commit-messages.txt"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            git log --format=%B "$PUSH_BEFORE..$GITHUB_SHA" > "$RUNNER_TEMP/commit-messages.txt"
            text_args="--text $RUNNER_TEMP/commit-messages.txt"
          elif [ "$GITHUB_EVENT_NAME" = "release" ]; then
            printf '%s\n\n%s\n' "$RELEASE_NAME" "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.txt"
            text_args="--text $RUNNER_TEMP/release-notes.txt"
          fi
          python tools/pii_check.py $text_args
      - name: Build the verified workflow distribution
        run: python tools/package_workflow.py --output-dir "$RUNNER_TEMP/handbuilt-release"
      - name: Verify the packaged entrypoint
        run: |
          python - <<'PY'
          import hashlib, os, subprocess, sys
          from pathlib import Path
          from tools.workflow_updates import unpack_verified, package_version, verify_installed
          output = Path(os.environ['RUNNER_TEMP']) / 'handbuilt-release'
          data = (output / 'handbuilt-workflow.zip').read_bytes()
          target = output / 'unpacked'
          target.mkdir()
          number = package_version(Path.cwd())
          unpack_verified(data, hashlib.sha256(data).hexdigest(), target, number)
          verify_installed(target)
          subprocess.run([sys.executable, str(target / 'tools/church_workflow.py'), '--help'], check=True)
          if os.environ['GITHUB_EVENT_NAME'] == 'release' and os.environ['GITHUB_REF_NAME'] != 'v' + number:
              raise SystemExit('Release tag must match both plugin manifest versions')
          PY
      - name: Save the checked distribution
        uses: actions/upload-artifact@v4
        with:
          name: handbuilt-workflow
          path: |
            ${{ runner.temp }}/handbuilt-release/handbuilt-workflow.zip
            ${{ runner.temp }}/handbuilt-release/handbuilt-workflow.sha256

  release-assets:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - name: Require release commit reachable from main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/download-artifact@v4
        with:
          name: handbuilt-workflow
          path: distribution
      - name: Attach verified assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" distribution/handbuilt-workflow.zip distribution/handbuilt-workflow.sha256
