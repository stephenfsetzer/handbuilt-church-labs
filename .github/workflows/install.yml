name: Install on a pastor's computer

# Runs the real setup on Windows, macOS and Linux, the way an agent would on a
# computer with no usable Python: Handbuilt fetches its own Python, builds its
# private environment, and passes the Church Command Center readiness check.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  setup:
    name: Setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      # Prove Handbuilt's own Python works. Without this, a runner's Python
      # would stand in for a failed download and the check would still pass.
      HANDBUILT_NO_COMPUTER_PYTHON: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Handbuilt fetches its own Python
        run: |
          export HANDBUILT_RUNTIME_HOME="$RUNNER_TEMP/handbuilt runtime"
          printf 'HANDBUILT_RUNTIME_HOME=%s\n' "$HANDBUILT_RUNTIME_HOME" >> "$GITHUB_ENV"
          tools/handbuilt-python --where
          tools/handbuilt-python -c "import sys, ssl; print(sys.version); print(ssl.OPENSSL_VERSION)"

      - name: Build the private environment and check readiness
        run: |
          tools/handbuilt-python tools/handbuilt_runtime.py setup --format json > "$RUNNER_TEMP/setup.json" || true
          cat "$RUNNER_TEMP/setup.json"
          tools/handbuilt-python tools/handbuilt_runtime.py doctor --capability workspace --format json > "$RUNNER_TEMP/doctor.json"
          tools/handbuilt-python - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print(report["status"], "-", report["message"])
          if report["status"] != "ready":
              raise SystemExit("The Church Command Center readiness check did not pass: " + str(report.get("next_action")))
          print(report["runtime"]["python"])
          PY

      - name: Create a church folder with the private environment
        run: |
          python_path=$(tools/handbuilt-python - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["runtime"]["python"])
          PY
          )
          printf 'HANDBUILT_TEST_PYTHON=%s\n' "$python_path" >> "$GITHUB_ENV"
          "$python_path" -m unittest tests.test_own_python -v 2>&1 | tail -40

      - name: Handbuilt's own PDF tools build and check a sample PDF
        if: runner.os != 'Linux'
        run: |
          tools/handbuilt-python tools/handbuilt_runtime.py native-install --own-tools --format json > "$RUNNER_TEMP/native.json" || true
          # Time the sample PDF by itself, so a slow first run shows up plainly.
          tools/handbuilt-python - "$RUNNER_TEMP/native.json" "$HANDBUILT_TEST_PYTHON" <<'PY' || true
          import json, subprocess, sys, time
          tools = json.load(open(sys.argv[1], encoding="utf-8"))["native_tools"]["locations"]
          start = time.time()
          import os
          done = subprocess.run([sys.argv[2], "-I", "-B", "-X", "faulthandler", "tools/runtime_probe.py",
                                 *[tools[name] for name in ("pdftoppm", "pdfinfo", "pdffonts", "pdftotext")]],
                                capture_output=True, text=True, timeout=900,
                                env={**os.environ, "DYLD_PRINT_LIBRARIES": "1"})
          print("sample PDF seconds:", round(time.time() - start), "exit:", done.returncode)
          print(done.stdout[-1500:])
          loaded = [line for line in done.stderr.splitlines() if "dyld" in line and ("native" in line or "homebrew" in line or "/usr/local" in line)]
          print("libraries loaded from outside the system:", len(loaded))
          print("\n".join(loaded[-60:]))
          print("\n".join(line for line in done.stderr.splitlines() if "dyld" not in line)[-3500:])
          PY
          tools/handbuilt-python tools/handbuilt_runtime.py verify --format json > "$RUNNER_TEMP/verify.json" || true
          tools/handbuilt-python - "$RUNNER_TEMP/native.json" "$RUNNER_TEMP/verify.json" <<'PY'
          import json, sys
          native = json.load(open(sys.argv[1], encoding="utf-8"))
          verify = json.load(open(sys.argv[2], encoding="utf-8"))
          print("native-install:", native["status"], "-", native["message"], "-", native.get("technical_detail"))
          print("tools:", native["native_tools"]["locations"])
          print("verify:", verify["status"], "-", verify["message"], "-", verify.get("technical_detail"))
          if verify["status"] != "ready" or not verify.get("verification", {}).get("ok"):
              raise SystemExit("A sample PDF could not be built and checked with Handbuilt's own PDF tools.")
          PY

      - name: The Windows command launcher works without Git Bash
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "HANDBUILT_RUNTIME_HOME=%RUNNER_TEMP%\handbuilt cmd runtime"
          call tools\handbuilt-python.cmd --where || exit /b 1
          call tools\handbuilt-python.cmd -c "import sys; print(sys.version)" || exit /b 1
          call tools\handbuilt-python.cmd -c "import pathlib; pathlib.Path('utf8-check.txt').write_text(chr(8220) + 'psalm' + chr(8221)); print(pathlib.Path('utf8-check.txt').read_text())" || exit /b 1

      - name: A Python Windows refuses to start falls back to the computer's own
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "HANDBUILT_NO_COMPUTER_PYTHON="
          set "HANDBUILT_RUNTIME_HOME=%RUNNER_TEMP%\handbuilt refused runtime"
          for /f "usebackq tokens=1,2" %%a in ("tools\python-dist.lock") do if "%%a"=="release" set "TAG=%%b"
          mkdir "%HANDBUILT_RUNTIME_HOME%\python-dist\%TAG%\python"
          rem Not a program, so Windows refuses to start it, as App Control would.
          echo not a program> "%HANDBUILT_RUNTIME_HOME%\python-dist\%TAG%\python\python.exe"
          call tools\handbuilt-python.cmd -c "import sys; print(sys.executable)" 2> "%RUNNER_TEMP%\fallback.txt" || exit /b 1
          type "%RUNNER_TEMP%\fallback.txt"
          findstr /c:"Using the Python already on this computer instead" "%RUNNER_TEMP%\fallback.txt" || exit /b 1
          set "HANDBUILT_NO_COMPUTER_PYTHON=1"
          call tools\handbuilt-python.cmd -c "print(1)" && exit /b 1
          exit /b 0

  install:
    # The path a pastor's computer takes: Claude downloads the plugin through
    # Git, with Git's own defaults, and the plugin then runs from where Claude
    # keeps it. An install made on the last release is updated to this one.
    name: Install through Claude on ${{ matrix.os }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
      SOURCE: https://github.com/${{ github.repository }}.git
      PLUGIN: handbuilt-church-labs@handbuilt-church-labs
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Use the line-ending setting Git for Windows installs with
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - name: Install the last release, the way an existing install has it
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude config"
          export HANDBUILT_RUNTIME_HOME="$RUNNER_TEMP/handbuilt runtime"
          printf 'CLAUDE_CONFIG_DIR=%s\nHANDBUILT_RUNTIME_HOME=%s\n' "$CLAUDE_CONFIG_DIR" "$HANDBUILT_RUNTIME_HOME" >> "$GITHUB_ENV"
          previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "Last release: $previous"
          claude plugin marketplace add "$SOURCE#$previous"
          claude plugin install "$PLUGIN"
          claude plugin list

      - name: Set up on the last release, so the update meets an existing install
        run: |
          old=$(find "$CLAUDE_CONFIG_DIR/plugins/cache/handbuilt-church-labs/handbuilt-church-labs" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          echo "Last release is at $old"
          # Releases up to 0.8.31 keep the launcher in bin/; later ones keep it in tools/.
          # A release from before Handbuilt brought its own Python has no launcher; skip those.
          launcher=
          for candidate in "$old/tools/handbuilt-python" "$old/bin/handbuilt-python"; do
            [ -x "$candidate" ] && { launcher=$candidate; break; }
          done
          if [ -n "$launcher" ]; then
            echo "Last release's launcher: $launcher"
            "$launcher" "$old/tools/handbuilt_runtime.py" setup --format json > "$RUNNER_TEMP/old-setup.json" || true
            "$launcher" "$old/tools/handbuilt_runtime.py" doctor --capability workspace --format json | head -c 400 || true
            "$launcher" --where > "$RUNNER_TEMP/old-python.txt"
            cp "$HANDBUILT_RUNTIME_HOME/active-runtime.json" "$RUNNER_TEMP/old-active-runtime.json" || true
            # A synthetic church folder connected to the last release.
            church="$RUNNER_TEMP/upgrade church"
            mkdir -p "$church"
            printf 'Synthetic note kept across the update.\n' > "$church/notes.md"
            "$launcher" "$old/tools/church_workflow.py" --church-folder "$church" connect --update-policy stable > "$RUNNER_TEMP/old-connect.json"
            printf 'UPGRADE_CHURCH=%s\n' "$church" >> "$GITHUB_ENV"
          fi

      - name: Update that install to this change
        run: |
          claude plugin marketplace remove handbuilt-church-labs
          claude plugin marketplace add "$SOURCE#$CANDIDATE_REF"
          claude plugin update "$PLUGIN" || claude plugin install "$PLUGIN"
          claude plugin list --json > "$RUNNER_TEMP/plugins.json"
          cat "$RUNNER_TEMP/plugins.json"

      - name: Find where Claude keeps the plugin and check it arrived whole
        run: |
          wanted=$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.claude-plugin/plugin.json" | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)
          plugin="$CLAUDE_CONFIG_DIR/plugins/cache/handbuilt-church-labs/handbuilt-church-labs/$wanted"
          echo "Expecting version $wanted at $plugin"
          test -d "$plugin" || { echo "Claude did not install version $wanted"; ls "$CLAUDE_CONFIG_DIR/plugins/cache/handbuilt-church-labs/handbuilt-church-labs"; exit 1; }
          printf 'PLUGIN_DIR=%s\n' "$plugin" >> "$GITHUB_ENV"
          # Git must not have rewritten line endings on the way in.
          if grep -q $'\r' "$plugin/tools/handbuilt-python" "$plugin/tools/python-dist.lock"; then
            echo "A launcher file arrived with Windows line endings"; exit 1
          fi

      - name: Set up from the installed copy
        run: |
          "$PLUGIN_DIR/tools/handbuilt-python" "$PLUGIN_DIR/tools/handbuilt_runtime.py" setup --format json > "$RUNNER_TEMP/setup.json" || true
          "$PLUGIN_DIR/tools/handbuilt-python" "$PLUGIN_DIR/tools/handbuilt_runtime.py" doctor --capability workspace --format json > "$RUNNER_TEMP/doctor.json"
          "$PLUGIN_DIR/tools/handbuilt-python" - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print(report["status"], "-", report["message"])
          if report["status"] != "ready":
              raise SystemExit("Setup from the installed copy did not pass: " + str(report.get("next_action")))
          PY

      - name: The update keeps the runtime and the church folder
        if: env.UPGRADE_CHURCH != ''
        run: |
          # The launcher moved from bin/ to tools/ in 0.8.32. It must find the same
          # Python the last release downloaded, not fetch a new one.
          "$PLUGIN_DIR/tools/handbuilt-python" --where > "$RUNNER_TEMP/new-python.txt"
          echo "Before: $(cat "$RUNNER_TEMP/old-python.txt")"
          echo "After:  $(cat "$RUNNER_TEMP/new-python.txt")"
          cmp "$RUNNER_TEMP/old-python.txt" "$RUNNER_TEMP/new-python.txt" || { echo "The update did not reuse the Python already downloaded"; exit 1; }
          "$PLUGIN_DIR/tools/handbuilt-python" "$PLUGIN_DIR/tools/church_workflow.py" --church-folder "$UPGRADE_CHURCH" connect > "$RUNNER_TEMP/new-connect.json"
          "$PLUGIN_DIR/tools/handbuilt-python" - "$RUNNER_TEMP/old-active-runtime.json" "$HANDBUILT_RUNTIME_HOME" "$UPGRADE_CHURCH" "$RUNNER_TEMP/new-connect.json" "$PLUGIN_DIR" <<'PY'
          import json, sys
          from pathlib import Path
          old_pointer, runtime, church, connect, plugin = sys.argv[1:]
          old = json.loads(Path(old_pointer).read_text(encoding="utf-8")) if Path(old_pointer).is_file() else {}
          if old.get("environment") and not (Path(runtime) / old["environment"]).is_dir():
              raise SystemExit(f"The update removed the last release's runtime: {old['environment']}")
          if (Path(church) / "notes.md").read_text(encoding="utf-8") != "Synthetic note kept across the update.\n":
              raise SystemExit("The church folder's own file changed during the update")
          report = json.loads(Path(connect).read_text(encoding="utf-8"))
          wanted = json.loads((Path(plugin) / ".claude-plugin" / "plugin.json").read_text(encoding="utf-8"))["version"]
          if report.get("status") != "connected" or report["installation"]["plugin_version"] != wanted:
              raise SystemExit(f"The church folder did not reconnect to {wanted}: {report}")
          print(f"Runtime kept, church folder kept and reconnected to {wanted}.")
          PY

      - name: Turn on automatic updates from the installed copy
        run: |
          "$PLUGIN_DIR/tools/handbuilt-python" "$PLUGIN_DIR/tools/claude_updates.py" enable
          "$PLUGIN_DIR/tools/handbuilt-python" "$PLUGIN_DIR/tools/claude_updates.py" status > "$RUNNER_TEMP/updates.json"
          cat "$RUNNER_TEMP/updates.json"
          "$PLUGIN_DIR/tools/handbuilt-python" - "$RUNNER_TEMP/updates.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if not (report.get("auto_update_on") and report.get("desktop_updates_allowed") and report.get("plugin_enabled")):
              raise SystemExit("Automatic updates did not turn on: " + str(report.get("message")))
          PY

      - name: PDF tools and a first bulletin from the installed copy
        if: runner.os != 'Linux'
        run: |
          "$PLUGIN_DIR/tools/handbuilt-python" "$PLUGIN_DIR/tools/handbuilt_runtime.py" native-install --own-tools --format json > "$RUNNER_TEMP/native.json" || true
          "$PLUGIN_DIR/tools/handbuilt-python" "$PLUGIN_DIR/tools/handbuilt_runtime.py" verify --format json > "$RUNNER_TEMP/verify.json" || true
          python_path=$("$PLUGIN_DIR/tools/handbuilt-python" - "$RUNNER_TEMP/verify.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if report["status"] != "ready" or not report.get("verification", {}).get("ok"):
              raise SystemExit("A sample PDF could not be built from the installed copy: " + str(report.get("technical_detail")))
          print(report["runtime"]["python"])
          PY
          )
          cd "$PLUGIN_DIR"
          # A whole church folder and real bulletins, built by the installed code.
          "$python_path" -m unittest tests.test_first_time_flow tests.test_bulletin_fit_round_two tests.test_bulletin_revision 2>&1 | tail -15

      - name: The Windows command launcher from the installed copy
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "HANDBUILT_RUNTIME_HOME=%RUNNER_TEMP%\handbuilt cmd runtime"
          call "%PLUGIN_DIR%\tools\handbuilt-python.cmd" -c "import sys; print(sys.version)" || exit /b 1

  suite:
    # The whole regression suite on Windows and on a Mac with nothing else
    # installed. It must pass: a failure here is a failure for a pastor there.
    name: Regression suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Prepare Handbuilt's environment
        run: |
          export HANDBUILT_RUNTIME_HOME="$RUNNER_TEMP/handbuilt runtime"
          printf 'HANDBUILT_RUNTIME_HOME=%s\n' "$HANDBUILT_RUNTIME_HOME" >> "$GITHUB_ENV"
          tools/handbuilt-python tools/handbuilt_runtime.py setup --format json > "$RUNNER_TEMP/setup.json" || true
          tools/handbuilt-python tools/handbuilt_runtime.py native-install --own-tools --format json > "$RUNNER_TEMP/native.json" || true
          tools/handbuilt-python tools/handbuilt_runtime.py doctor --capability workspace --format json > "$RUNNER_TEMP/doctor.json"
      - name: Run the regression suite
        run: |
          python_path=$(tools/handbuilt-python - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["runtime"]["python"])
          PY
          )
          "$python_path" -m unittest discover -v -s tests -p 'test_*.py' > "$RUNNER_TEMP/suite.log" 2>&1 || true
          grep -E "^(FAIL|ERROR): |^Ran |^OK|^FAILED" "$RUNNER_TEMP/suite.log" | head -300
          echo "Why tests were skipped on this system:"
          grep -oE "skipped '[^']*'|skipped \"[^\"]*\"" "$RUNNER_TEMP/suite.log" | sort | uniq -c | sort -rn
          grep -q "^OK" "$RUNNER_TEMP/suite.log"
      - name: Save the full suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log-${{ matrix.os }}
          path: ${{ runner.temp }}/suite.log
