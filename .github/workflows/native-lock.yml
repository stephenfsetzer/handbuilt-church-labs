name: Refresh the PDF tools lock

# Works out which conda-forge packages make up Pango and Poppler on each kind of
# computer, and records each package's address and SHA-256. A maintainer reviews
# the result and commits it as tools/native-tools.lock. Nothing here runs on a
# pastor's computer.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-lock.yml"

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - name: Get the package solver and check it
        run: |
          curl -fsSL -o "$RUNNER_TEMP/micromamba" \
            https://github.com/mamba-org/micromamba-releases/releases/download/2.10.0-0/micromamba-linux-64
          echo "701f39c06f8e6a670a0e186c8479b9e5c0502a2f0cda6cef65d83bdd2875e8bd  $RUNNER_TEMP/micromamba" | sha256sum -c
          chmod +x "$RUNNER_TEMP/micromamba"
      - name: Solve for each computer
        run: |
          mkdir "$RUNNER_TEMP/solve"
          for computer in osx-arm64 osx-64 win-64; do
            MAMBA_ROOT_PREFIX="$RUNNER_TEMP/root-$computer" "$RUNNER_TEMP/micromamba" create --yes \
              --prefix "$RUNNER_TEMP/env-$computer" --platform "$computer" \
              --channel conda-forge --override-channels --dry-run --json \
              pango poppler > "$RUNNER_TEMP/solve/$computer.json"
          done
      - name: Write the lock
        run: |
          python3 - "$RUNNER_TEMP/solve" > "$RUNNER_TEMP/native-tools.lock" <<'PY'
          import json, sys
          from datetime import date
          from pathlib import Path
          names = {"osx-arm64": "darwin-aarch64", "osx-64": "darwin-x86_64", "win-64": "windows-x86_64"}
          print("# Handbuilt's own PDF tools: Pango and Poppler from conda-forge.")
          print("# <computer> <sha256> <size> <url>")
          print(f"release {date.today():%Y%m%d}")
          for path in sorted(Path(sys.argv[1]).glob("*.json")):
              actions = json.loads(path.read_text())["actions"]
              packages = actions.get("FETCH") or actions.get("LINK") or []
              for package in sorted(packages, key=lambda item: item["name"]):
                  url = package.get("url") or f'{package["channel"].rstrip("/")}/{package["subdir"]}/{package["fn"]}'
                  print(names[path.stem], package["sha256"], package.get("size", 0), url)
          PY
          cat "$RUNNER_TEMP/native-tools.lock"
          awk '$1 ~ /-/ { count[$1]++; size[$1] += $3 } END { for (k in count) printf "%s: %d packages, %.0f MB\n", k, count[k], size[k] / 1e6 }' "$RUNNER_TEMP/native-tools.lock"
      - name: Save the lock
        uses: actions/upload-artifact@v4
        with:
          name: native-tools-lock
          path: ${{ runner.temp }}/native-tools.lock
